<table style="width:100%; border-collapse:collapse; text-align:left;">
    <thead style="background:#f9fafb; border-bottom:1px solid #e5e7eb;">
        <tr>
            <th style="padding:10px; font-size:13px; color:#374151;">Status / Paciente</th>
            <th style="padding:10px; font-size:13px; color:#374151;">Idade</th>
            <th style="padding:10px; font-size:13px; color:#374151; text-align:right;">Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for p in lista_pacientes %}
        <tr style="border-bottom:1px solid #f3f4f6; transition: background 0.2s;" onmouseover="this.style.background='#f9fafb'" onmouseout="this.style.background='white'">
            <td style="padding:10px; font-weight:600; font-size:14px; color:#111827; display:flex; align-items:center; gap:10px;">
                {% if p.cor_status == 'vermelho' %}
                    <span title="Vacina Atrasada!" style="display:inline-block; width:12px; height:12px; border-radius:50%; background:#ef4444; box-shadow: 0 0 5px #ef4444;"></span>
                {% else %}
                    <span title="Caderneta em Dia" style="display:inline-block; width:12px; height:12px; border-radius:50%; background:#10b981;"></span>
                {% endif %}
                <a href="{% url 'encaminhamentos:paciente' p.pk %}" style="color:#0284c7; text-decoration:none;">{{ p.nome }}</a>
            </td>
            
            <td style="padding:10px; font-size:14px; color:#4b5563;">
                {{ p.idade_formatada }}
            </td>
            
            <td style="padding:10px; text-align:right; display:flex; justify-content:flex-end; gap:8px;">
                <button onclick="toggleCaderneta({{ p.pk }})" style="background:#f3f4f6; color:#4b5563; border:1px solid #d1d5db; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; cursor:pointer; transition:0.2s;">
                    🔽 Resumo
                </button>
                
                <a href="{% url 'vacinas:carteira' p.pk %}" style="background:#10b981; color:white; padding:4px 10px; border-radius:6px; font-size:12px; text-decoration:none; font-weight:bold;">
                    💉 Aplicar
                </a>
            </td>
        </tr>
        
        <tr id="linha-caderneta-{{ p.pk }}" style="display:none; background:#f8fafc; border-bottom:2px solid #cbd5e1;">
            <td colspan="3" style="padding:0;">
                <div id="conteudo-caderneta-{{ p.pk }}" style="padding:16px;">
                    <div style="text-align:center; color:#6b7280; font-size:13px;">
                        <span style="display:inline-block; animation: spin 1s linear infinite;">⏳</span> Carregando dados do PNI...
                    </div>
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>
    function toggleCaderneta(pacienteId) {
        var linha = document.getElementById('linha-caderneta-' + pacienteId);
        var divConteudo = document.getElementById('conteudo-caderneta-' + pacienteId);

        if (linha.style.display === 'none') {
            // 1. Abre a linha
            linha.style.display = 'table-row';

            // 2. Só chama o servidor se o conteúdo ainda estiver "Carregando..."
            if (divConteudo.innerHTML.includes('Carregando')) {
                fetch(`/vacinas/api/caderneta/${pacienteId}/`)
                    .then(response => response.text())
                    .then(html => {
                        divConteudo.innerHTML = html; // 3. Injeta a caderneta linda!
                    })
                    .catch(error => {
                        divConteudo.innerHTML = '<span style="color:red;">Erro ao carregar caderneta.</span>';
                    });
            }
        } else {
            // Se já estava aberta, fecha a linha
            linha.style.display = 'none';
        }
    }
</script>
