{% extends 'base.html' %}
{% block titulo %}{{ titulo }} — {{ sistema.nome }}{% endblock %}

{% block conteudo %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-200">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">{{ titulo }}</h1>
            <p class="text-gray-600 mt-1">Defina os papéis e permissões locais do profissional na USF.</p>
        </div>
        <a href="{% url 'core:admin_equipe' %}" class="text-gray-500 hover:text-gray-700 font-medium flex items-center gap-2 transition bg-white border border-gray-300 py-2 px-4 rounded-lg shadow-sm text-sm">
            Voltar
        </a>
    </div>

    <form method="post" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        {% csrf_token %}
        
        <div class="space-y-6">
            <div class="form-group">
                <label class="block text-sm font-bold text-gray-700 mb-2">Profissional *</label>
                <select name="user" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 bg-white focus:ring-green-500 focus:border-green-500 text-sm">
                    <option value="">Selecione o profissional...</option>
                    {% for u in usuarios %}
                        <option value="{{ u.pk }}" {% if vinculo and vinculo.user_id == u.pk %}selected{% endif %}>
                            {{ u.get_full_name|default:u.username }} (CPF: {{ u.perfil.cpf|default:"N/A" }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="form-group">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Unidade de Saúde (USF) *</label>
                    <select name="usf" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 bg-white focus:ring-green-500 focus:border-green-500 text-sm">
                        <option value="">Selecione a USF...</option>
                        {% for usf in usfs %}
                            <option value="{{ usf.pk }}" {% if vinculo and vinculo.usf_id == usf.pk %}selected{% endif %}>
                                {{ usf.nome }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Cargo *</label>
                    <select name="cargo" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 bg-white focus:ring-green-500 focus:border-green-500 text-sm">
                        <option value="">Selecione o cargo...</option>
                        {% for c in cargos %}
                            <option value="{{ c.pk }}" {% if vinculo and vinculo.cargo_id == c.pk %}selected{% endif %}>
                                {{ c.nome }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Caixa de Poder Local (Admin da Unidade) -->
            <div class="p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                <label class="flex items-start gap-3 cursor-pointer">
                    <input type="checkbox" name="is_admin_unidade" class="mt-1 w-5 h-5 text-yellow-600 border-gray-300 rounded focus:ring-yellow-500" {% if vinculo and vinculo.is_admin_unidade %}checked{% endif %}>
                    <div>
                        <span class="text-sm font-bold text-yellow-900 block">Administrador desta Unidade (Coordenador Local)</span>
                        <span class="text-xs text-yellow-700 block mt-0.5 leading-relaxed">
                            Permite que este profissional gira os membros da equipa, edite cadastros de pacientes e acompanhe relatórios sensíveis <strong>apenas nesta USF</strong>.
                        </span>
                    </div>
                </label>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Data de Entrada</label>
                    <input type="date" name="data_entrada" class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:ring-green-500" value="{{ vinculo.data_entrada|date:'Y-m-d'|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Data de Saída</label>
                    <input type="date" name="data_saida" class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:ring-green-500" value="{{ vinculo.data_saida|date:'Y-m-d'|default:'' }}">
                </div>
            </div>

            <div class="border-t border-gray-100 pt-4">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="ativo" class="w-5 h-5 text-green-600 border-gray-300 rounded focus:ring-green-500" {% if not vinculo or vinculo.ativo %}checked{% endif %}>
                    <span class="text-sm font-medium text-gray-800">Vínculo Ativo no Sistema</span>
                </label>
            </div>
        </div>

        <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-gray-100">
            <a href="{% url 'core:admin_equipe' %}" class="px-5 py-2.5 text-gray-600 font-medium hover:bg-gray-100 rounded-lg transition text-sm">Cancelar</a>
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-6 rounded-lg shadow-md transition text-sm">
                {{ acao }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
