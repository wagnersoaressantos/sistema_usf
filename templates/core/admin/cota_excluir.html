{% extends 'base.html' %}
{% block titulo %}Excluir cota{% endblock %}

{% block conteudo %}

<div class="card" style="max-width:480px; margin:2rem auto; text-align:center;">
    <div style="font-size:48px; margin-bottom:1rem;">⚠️</div>
    <h2 style="font-size:18px; font-weight:600; margin-bottom:8px;">
        Excluir cota?
    </h2>
    <p style="font-size:14px; color:#6b7280; margin-bottom:1.5rem;">
        A cota de <strong>{{ cota.cota }}</strong> encaminhamentos/mês
        para <strong>{{ cota.tipo.nome }}</strong> na
        <strong>{{ cota.usf.nome }}</strong> será removida.
    </p>
    <div style="display:flex; gap:10px; justify-content:center;">
        <a href="{% url 'encaminhamentos:admin_cotas' %}" class="btn btn-cinza">
            Cancelar
        </a>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-verde"
                    style="background:#dc2626;">
                Confirmar exclusão
            </button>
        </form>
    </div>
</div>

{% endblock %}
