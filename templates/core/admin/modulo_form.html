{% extends 'base.html' %}
{% block titulo %}{{ titulo }} — {{ sistema.nome }}{% endblock %}

{% block conteudo %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-200">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">{{ titulo }}</h1>
            <p class="text-gray-600 mt-1">Configuração de apps e módulos.</p>
        </div>
        <a href="{% url 'core:admin_modulos' %}" class="text-gray-500 hover:text-gray-700 font-medium flex items-center gap-2 transition bg-white border border-gray-300 py-2 px-4 rounded-lg shadow-sm">
            Voltar
        </a>
    </div>

    <form method="POST" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="col-span-1 md:col-span-2">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Nome do Módulo (Visível)</label>
                <input type="text" name="nome" value="{{ modulo.nome|default:'' }}" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-purple-500" placeholder="Ex: Regulação e Cotas">
            </div>
            
            <div class="col-span-1">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Código Interno (Motor)</label>
                
                <!-- 🚀 O NOVO BLOQUEIO MÁGICO AQUI -->
                <input type="text" value="{{ modulo.slug_app }}" disabled class="w-full border border-gray-200 bg-gray-100 text-gray-500 rounded-lg px-4 py-2 font-mono text-sm cursor-not-allowed">
                
                <p class="text-[10px] text-gray-400 mt-1">Bloqueado. O sistema encarrega-se da segurança do código.</p>
            </div>
            
            <div class="col-span-1">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Ordem no Menu</label>
                <input type="number" name="ordem" value="{{ modulo.ordem|default:'1' }}" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-purple-500">
            </div>
        </div>

        <div class="mb-8 p-4 bg-purple-50 border border-purple-100 rounded-lg">
            <label class="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" name="ativo" class="w-5 h-5 text-purple-600 border-gray-300 rounded" {% if not modulo or modulo.ativo %}checked{% endif %}>
                <span class="text-sm font-bold text-purple-900">Módulo Ativo e Visível para todos</span>
            </label>
        </div>

        <div class="flex justify-end pt-4 border-t border-gray-100">
            <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-6 rounded-lg shadow-md transition">{{ acao }}</button>
        </div>
    </form>
</div>
{% endblock %}
