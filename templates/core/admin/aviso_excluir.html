{% extends 'base.html' %}
{% block titulo %}Excluir Aviso{% endblock %}

{% block conteudo %}
<h1 class="page-title">🗑 <span>Excluir</span> Aviso</h1>

<div class="card" style="max-width:480px;">
    <div style="background:#fee2e2;border-left:4px solid #dc2626;
                border-radius:6px;padding:14px 16px;margin-bottom:1.5rem;">
        <div style="font-weight:600;color:#991b1b;margin-bottom:4px;">
            ⚠ Essa ação não pode ser desfeita
        </div>
    </div>

    <div style="margin-bottom:1.5rem;font-size:14px;">
        <p style="color:#6b7280;margin-bottom:8px;">
            Você está prestes a excluir o aviso:
        </p>
        <strong>{{ aviso.titulo }}</strong>
        <p style="font-size:12px;color:#9ca3af;margin-top:4px;">
            Válido até {{ aviso.data_validade|date:"d/m/Y" }}
        </p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div style="display:flex;gap:10px;">
            <button type="submit"
                    style="background:#dc2626;color:white;border:none;"
                    class="btn">
                🗑 Sim, excluir
            </button>
            <a href="{% url 'core:admin_avisos' %}" class="btn btn-cinza">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
