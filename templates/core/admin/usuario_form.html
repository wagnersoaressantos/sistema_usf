{% extends 'base.html' %}
{% block titulo %}{{ titulo }} — {{ sistema.nome }}{% endblock %}

{% block conteudo %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    
    <div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-200">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">{{ titulo }}</h1>
            <p class="text-gray-600 mt-1">Defina as credenciais de acesso e o nível de privilégio global do utilizador.</p>
        </div>
        <a href="{% url 'core:admin_usuarios' %}" class="text-gray-500 hover:text-gray-700 font-medium flex items-center gap-2 transition bg-white border border-gray-300 py-2 px-4 rounded-lg shadow-sm text-sm">
            Voltar
        </a>
    </div>

    <form method="post" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        {% csrf_token %}
        
        <div class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="form-group">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Nome *</label>
                    <input type="text" name="nome" value="{{ perfil.user.first_name|default:'' }}" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-green-500 focus:border-green-500 bg-white" placeholder="Primeiro nome">
                </div>
                <div class="form-group">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Sobrenome</label>
                    <input type="text" name="sobrenome" value="{{ perfil.user.last_name|default:'' }}" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-green-500 focus:border-green-500 bg-white" placeholder="Apelido / Sobrenome">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="form-group">
                    <label class="block text-sm font-bold text-gray-700 mb-2">CPF (Aceder ao sistema) *</label>
                    <input type="text" name="cpf" value="{{ perfil.cpf|default:'' }}" maxlength="14" required class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-green-500 focus:border-green-500 bg-white font-mono" placeholder="000.000.000-00">
                </div>
                <div class="form-group">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Nível de Acesso Global</label>
                    <select name="nivel" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm bg-white focus:ring-green-500 focus:border-green-500">
                        <option value="comum" {% if not perfil or not perfil.is_master %}selected{% endif %}>Profissional Comum / Local</option>
                        <option value="master" {% if perfil and perfil.is_master %}selected{% endif %}>Gestor Municipal (Master)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="block text-sm font-bold text-gray-700 mb-2">
                    {% if perfil %}
                        Nova Senha <span class="text-xs font-normal text-gray-400">— deixe em branco para manter a atual</span>
                    {% else %}
                        Senha de Acesso *
                    {% endif %}
                </label>
                <input type="password" name="senha" {% if not perfil %}required{% endif %} class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-green-500 focus:border-green-500 bg-white" placeholder="Mínimo de 6 caracteres">
            </div>

            <div class="border-t border-gray-100 pt-4">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="ativo" class="w-5 h-5 text-green-600 border-gray-300 rounded focus:ring-green-500" {% if not perfil or perfil.ativo %}checked{% endif %}>
                    <div>
                        <span class="text-sm font-medium text-gray-800">Utilizador Ativo no Sistema</span>
                        <span class="text-xs text-gray-500 block">Utilizadores inativos não conseguem efetuar login na plataforma.</span>
                    </div>
                </label>
            </div>
        </div>

        <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-gray-100">
            <a href="{% url 'core:admin_usuarios' %}" class="px-5 py-2.5 text-gray-600 font-medium hover:bg-gray-100 rounded-lg transition text-sm">Cancelar</a>
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-6 rounded-lg shadow-md transition text-sm">
                {{ acao }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
