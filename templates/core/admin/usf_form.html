{% extends 'base.html' %}
{% block titulo %}{{ titulo }} — Administração{% endblock %}

{% block conteudo %}
<h1 class="page-title">🏥 <span>{{ titulo }}</span></h1>

<div class="card" style="max-width:480px;">
    <div class="card-title">{{ titulo }}</div>

    <form method="post">
        {% csrf_token %}

        <div class="form-group" style="margin-bottom:1rem;">
            <label>Nome da USF *</label>
            <input type="text" name="nome" class="form-input"
                   value="{{ usf.nome|default:'' }}"
                   placeholder="Ex: USF Bom Jesus 2"
                   required autofocus>
        </div>

        <div style="display:flex; gap:1rem; margin-bottom:1rem;">
            <div class="form-group" style="flex:1;">
                <label>CNES</label>
                <input type="text" name="cnes" class="form-input"
                       value="{{ usf.cnes|default:'' }}"
                       placeholder="7 dígitos"
                       maxlength="7">
            </div>
            
            <div class="form-group" style="flex:2;">
                <label>Município</label>
                <input type="text" name="municipio" class="form-input"
                       value="{{ usf.municipio|default:'' }}"
                       placeholder="Ex: Serra Talhada">
            </div>
        </div>

        <div class="form-group" style="margin-bottom:1.5rem;">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                <input type="checkbox" name="ativo"
                       {% if not usf or usf.ativo %}checked{% endif %}
                       style="width:16px;height:16px;accent-color:var(--verde);">
                USF ativa
                <span style="font-size:12px;color:#6b7280;">
                    — USFs inativas não aparecem no formulário de cadastro
                </span>
            </label>
        </div>

        <div style="display:flex;gap:10px;">
            <button type="submit" class="btn btn-verde">✓ {{ acao }}</button>
            <a href="{% url 'core:admin_usfs' %}" class="btn btn-cinza">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
